<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 — Página não encontrada</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --muted: #6b7280;
            --accent: #0ea5a4
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #111827;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .card {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
            max-width: 820px;
            width: 100%;
            display: flex;
            gap: 32px;
            align-items: center
        }

        .logo {
            font-size: 72px;
            line-height: 1
        }

        h1 {
            margin: 0;
            font-size: 28px
        }

        p {
            margin: 8px 0 16px;
            color: var(--muted)
        }

        .actions {
            display: flex;
            gap: 12px
        }

        a.btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600
        }

        a.primary {
            background: var(--accent);
            color: #fff
        }

        a.ghost {
            background: transparent;
            border: 1px solid #e6e9ee;
            color: #111827
        }

        @media (max-width:640px) {
            .card {
                flex-direction: column;
                text-align: center
            }
        }
    </style>
</head>

<body>
    <div class="card" role="main" aria-labelledby="title">
        <div class="logo" aria-hidden="true">🗺️</div>
        <div>
            <h1 id="title">404 — Página não encontrada</h1>
            <p>Desculpe, a página que você tentou acessar não existe ou foi movida.</p>
            <div class="actions">
                <a class="btn primary" href="/">Voltar para o início</a>
            </div>
        </div>
    </div>
</body>

</html>
